<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>pomo</title><link rel="stylesheet" href="css/style.css"></head><body>
<div id="bg"></div>
<main>
<header class="glass bar"><b>🌱 pomo</b><div><button class="ic" data-a="panel" data-id="wall" title="Fundos">🖼️</button><button class="ic" data-a="panel" data-id="aud" title="Sons">🎧</button><button class="ic" data-a="panel" data-id="set" title="Ajustes">⚙️</button></div></header>
<section class="grid">
<div class="glass timer">
<div class="tabs" id="modes"></div>
<div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" class="trk"/><circle id="arc" cx="60" cy="60" r="54" class="arc"/></svg><div id="time">25:00</div></div>
<div class="ctl"><button id="go" class="big" data-a="go">começar</button><button class="ic" data-a="skip" title="Pular">⏭</button><button class="ic" data-a="reset" title="Reiniciar">↺</button></div>
<div id="now" class="muted"></div>
<div class="plant"><div id="plant"></div><small id="goalTxt"></small></div>
</div>
<div class="glass tasks">
<div id="lists" class="chips"></div>
<form id="add"><input id="tn" placeholder="Nova task…" required maxlength="80"><input id="tt" placeholder="Detalhes (opcional)" maxlength="200"><label class="est">🍅<input id="te" type="number" min="1" max="20" value="1"></label><button class="big sm">adicionar</button></form>
<ul id="tl"></ul>
<div class="foot"><button class="chip" data-a="archive">📦 arquivar concluídas</button><button class="chip" data-a="panel" data-id="arc">ver arquivo</button><button class="chip" data-a="delList">apagar lista</button></div>
</div>
</section></main>
<div id="panel" class="glass" hidden></div>
<script src="js/config.js"></script><script src="js/app.js"></script>
</body></html>
